name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4.0.0
      # Install dependencies
      - run: npm ci
      # Build
      - run: npm run build
      # Test
      - run: npm run check
